<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Card ศัพท์อังกฤษ-ไทย</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>📚 Flash Card ศัพท์อังกฤษ → ไทย</h1>

  <div class="tabs" role="group" aria-label="โหมด">
    <button id="modeStudy" aria-pressed="true">📖 ท่องศัพท์</button>
    <button id="modeQuiz" aria-pressed="false">📝 แบบทดสอบ</button>
  </div>

  <div class="toolbar">
    <select id="category" aria-label="หมวดหมู่"></select>
    <div id="studyTools" class="toolrest">
      <label><input type="checkbox" id="hideKnown"> ซ่อนคำที่จำได้แล้ว</label>
      <button id="shuffle">🔀 สลับลำดับ</button>
      <button id="reset">↺ รีเซ็ต</button>
    </div>
  </div>

  <div id="study">
  <div class="progress"><div id="bar"></div></div>
  <p id="status" class="status"></p>

  <div id="card" class="card" tabindex="0" role="button" aria-label="พลิกการ์ด">
    <div class="inner">
      <div class="face front">
        <span id="word"></span>
        <small id="phon"></small>
        <button id="speak" class="icon" title="ฟังเสียง" aria-label="ฟังเสียง">🔊</button>
      </div>
      <div class="face back">
        <span id="meaning"></span>
        <small id="example"></small>
      </div>
    </div>
  </div>
  <p class="hint">คลิกการ์ดหรือกด <kbd>Space</kbd> เพื่อพลิก · <kbd>←</kbd> <kbd>→</kbd> เปลี่ยนการ์ด · <kbd>K</kbd> จำได้แล้ว</p>

  <div class="controls">
    <button id="prev">← ก่อนหน้า</button>
    <button id="unknown" class="bad">✗ ยังไม่จำ</button>
    <button id="known" class="good">✓ จำได้แล้ว</button>
    <button id="next">ถัดไป →</button>
  </div>

  <details>
    <summary>➕ เพิ่มคำศัพท์ของคุณเอง</summary>
    <form id="addForm">
      <input id="newEn" placeholder="English" required>
      <input id="newTh" placeholder="ภาษาไทย" required>
      <input id="newEx" placeholder="ตัวอย่างประโยค (ไม่บังคับ)">
      <button>เพิ่ม</button>
    </form>
  </details>
  </div>

  <section id="quiz" hidden>
    <div id="quizSetup" class="quiz-box">
      <p id="quizInfo" class="status"></p>
      <div class="toolbar">
        <select id="quizDir" aria-label="ทิศทางคำถาม">
          <option value="en">อังกฤษ → ไทย</option>
          <option value="th">ไทย → อังกฤษ</option>
        </select>
        <select id="quizCount" aria-label="จำนวนข้อ">
          <option value="10">10 ข้อ</option>
          <option value="20">20 ข้อ</option>
          <option value="30">30 ข้อ</option>
        </select>
      </div>
      <div class="controls"><button id="quizStart" class="primary">เริ่มทดสอบ</button></div>
    </div>

    <div id="quizPlay" class="quiz-box" hidden>
      <p id="quizStatus" class="status"></p>
      <div class="progress"><div id="quizBar"></div></div>
      <div class="q-prompt">
        <span id="qWord" class="q-word"></span>
        <small id="qPhon"></small>
        <button id="qSpeak" class="inline-icon" title="ฟังเสียง" aria-label="ฟังเสียง">🔊</button>
      </div>
      <div id="opts" class="opts"></div>
      <p id="qFeedback" class="feedback" aria-live="polite"></p>
      <div class="controls"><button id="qNext" class="primary" hidden>ถัดไป →</button></div>
      <p class="hint">กด <kbd>1</kbd>–<kbd>4</kbd> เพื่อตอบ · <kbd>Enter</kbd> ข้อถัดไป</p>
    </div>

    <div id="quizResult" class="quiz-box" hidden>
      <p id="resScore" class="q-word"></p>
      <p id="resMsg" class="status"></p>
      <ul id="resWrong" class="wrong-list"></ul>
      <div class="controls">
        <button id="retryWrong" hidden>ทำข้อที่ผิดซ้ำ</button>
        <button id="quizAgain" class="primary">ทำใหม่</button>
      </div>
    </div>
  </section>
</main>
<script src="words.js"></script>
<script src="ipa.js"></script>
<script src="app.js"></script>
</body>
</html>
